[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-reporting-platform"
version = "0.1.0"
description = "Portfolio Edition Monthly analytics reporting platform (Adobe → RAW → CALC → CDM)."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary" }
authors = [
  { name = "Analytics Reporting Platform" },
]
keywords = ["analytics", "reporting", "postgresql", "monthly"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]
# Runtime dependency set justified by validated Monthly legacy notebook stack.
# Exact historical versions are unknown; ranges are Portfolio Edition choices (TBD tightening).
dependencies = [
  "pandas>=2.0,<3",
  "requests>=2.28,<3",
  "SQLAlchemy>=2.0,<3",
  "psycopg2-binary>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0,<9",
]

[project.urls]
Documentation = "docs/current-state.md"

[project.scripts]
analytics-reporting = "analytics_reporting_platform.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
analytics_reporting_platform = ["py.typed"]
