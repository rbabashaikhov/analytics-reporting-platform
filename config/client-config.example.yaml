# Public-safe Adobe client configuration example — Portfolio Edition
#
# Copy to a private location outside Git and fill real identifiers there.
#
# Do NOT put OAuth secrets in this file. Use private env:
#   ADOBE_CLIENT_ID / ADOBE_CLIENT_SECRET / ADOBE_GLOBAL_COMPANY_ID
#
# Logical keys are arbitrary strings defined by the runtime config.
# Public Portfolio artifacts use anonymized taxonomy (product_N /
# content_section_N); the private full runtime may use its own operational
# keys. Mapping between them is private and excluded from Git.
#
# Values below are empty placeholders only — not a complete category inventory.

adobe:
  report_suite_id: ""

  segments:
    segment_1: ""
    segment_2: ""

  section_traffic_segments:
    traffic_segment_1: ""
    traffic_segment_2: ""

  sections:
    product_1: ""
    product_2: ""
    content_section_1: ""
    content_section_2: ""

  # Required for full-private by-URL extraction (Adobe dimension id).
  # Leave empty in the public example; set only in private config.
  page_url_dimension: ""
